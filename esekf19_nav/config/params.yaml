/**:
  ros__parameters:
    use_sim_time: true

    # =========================================================================
    # 1. TÊN TOPIC & HỆ QUY CHIẾU (FRAMES)
    # =========================================================================
    topics:
      imu: "/imu/data"                          # sensor_msgs/Imu (400 Hz)
      dvl: "/dvl/velocity"                      # geometry_msgs/TwistWithCovarianceStamped (5 Hz)
      depth: "/depth/pressure"                  # sensor_msgs/FluidPressure (5 Hz)
      gnss_odom: "/gnss/odometry"               # nav_msgs/Odometry (1 Hz, bề mặt)
      output_odom: "/odometry/filtered"         # nav_msgs/Odometry (Ước lượng dẫn đường ES-EKF)
      output_calib: "/esekf/calibration"        # std_msgs/Float64MultiArray (Góc Boresight & Scale)

    frames:
      odom_frame: "odom"                        # Hệ quy chiếu cố định cục bộ (NED)
      base_frame: "base_link"                   # Khung thân UUV

    # =========================================================================
    # 2. THAM SỐ VẬT LÝ & HÌNH HỌC LẮP ĐẶT (SYSTEM & GEOMETRY)
    # =========================================================================
    system:
      gravity: 9.80665                         # Gia tốc trọng trường chuẩn g (m/s^2)
      latitude_deg: 20.8                       # Vĩ độ hoạt động (độ) để tính vận tốc tự quay Trái Đất
      water_density: 1025.0                    # Khối lượng riêng nước biển (kg/m^3)
      atmospheric_pressure: 101325.0           # Áp suất khí quyển chuẩn tại mặt nước (Pa)
      lever_arm: [0.5, -0.1, 0.2]              # Cánh tay đòn [x, y, z] từ IMU đến DVL trong khung thân (m)

    # =========================================================================
    # 3. ĐẶC TÍNH NHIỄU CẢM BIẾN (SENSOR NOISE SPECIFICATIONS)
    # Chuẩn thiết bị: GEO-FOG 3D Dual INS + DVL A125
    # =========================================================================
    noise:
      # Cảm biến quán tính FOG IMU
      acc_vrw: 0.002                           # Velocity Random Walk gia tốc kế (m/s/sqrt(s))
      gyro_arw: 0.00000349                     # Angular Random Walk con quay FOG (0.012 deg/sqrt(h) = 3.49e-6 rad/sqrt(s))
      acc_bias_sigma: 0.0001                   # Độ ổn định in-run bias gia tốc kế (m/s^2)
      acc_bias_tau: 3600.0                     # Thời gian tương quan Gauss-Markov gia tốc kế (s)
      gyro_bias_rw: 0.000001                   # Tốc độ trôi ngẫu nhiên bias con quay (rad/s/sqrt(s))
      scale_rw: 0.00001                        # Tốc độ biến thiên hệ số tỉ lệ DVL s (1/sqrt(s))
      boresight_rw: 0.00001                    # Tốc độ rung cơ học góc Boresight DVL (rad/sqrt(s))

      # Cảm biến phụ trợ
      dvl_noise_floor: 0.01                    # Nhiễu sàn DVL (m/s)
      dvl_noise_slope: 0.005                   # Hệ số tăng nhiễu theo vận tốc DVL
      depth_sigma: 0.05                        # Độ lệch chuẩn cảm biến áp suất đo sâu (m)
      gnss_pos_sigma: 0.02                     # Độ chính xác vị trí GNSS RTK mặt nước (m)
      gnss_vel_sigma: 0.02                     # Độ chính xác vận tốc GNSS RTK (m/s)
      gnss_yaw_sigma: 0.0017                   # Độ chính xác hướng Dual Antenna GNSS (rad, ~0.1 deg)

    # =========================================================================
    # 4. TRẠNG THÁI KHỞI TẠO (INITIAL CONDITIONS)
    # =========================================================================
    initial_state:
      position: [0.0, 0.0, 0.0]                # Vị trí xuất phát [North, East, Down] (m)
      velocity: [0.0, 0.0, 0.0]                # Vận tốc xuất phát [v_N, v_E, v_D] (m/s)
      rpy_deg: [0.0, 0.0, 0.0]                 # Tư thế xuất phát [Roll, Pitch, Yaw] (độ)

    # =========================================================================
    # 5. CẤU HÌNH VẬN HÀNH & AN TOÀN (OPERATION & WATCHDOG)
    # =========================================================================
    operation:
      lock_calibration_underwater: true        # Khóa Boresight & Scale khi lặn ngầm để dồn thông tin DVL ước lượng tư thế & vận tốc
      gnss_timeout_sec: 5.0                    # Quá 5 giây không có GNSS -> xác định tàu đã lặn ngầm
      watchdog_sensor_timeout_sec: 3.0         # Cảnh báo logger nếu topic cảm biến ngừng phát > 3s
      max_dt_threshold: 0.5                    # Ngưỡng phát hiện đứt quãng bước thời gian (s)
